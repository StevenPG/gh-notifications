<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Notifications</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #21262d; --border: #30363d; --muted: #8b949e; --text: #e6edf3;
    --open: #3fb950; --merged: #a371f7; --closed: #f85149; --draft: #8b949e; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 5; background: rgba(22,27,34,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 10px 20px; }
  .top { display: flex; align-items: center; gap: 12px; }
  h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 600; }
  #status { color: var(--muted); font-size: 12px; margin-left: auto; }
  input[type=text], select, button { background: var(--bg); color: inherit; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 13px; }
  input[type=text]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { cursor: pointer; transition: background .1s; }
  button:hover { background: var(--line); }
  button.primary { background: #238636; border-color: #2ea043; color: #fff; }
  button.primary:hover { background: #2ea043; }
  button.danger { border-color: #f8514966; color: var(--closed); }
  button.danger:hover { background: #f8514922; }
  button:disabled { opacity: .4; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; border-right: 1px solid var(--border); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: #1f6feb33; color: var(--accent); }
  .bar { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  #q { flex: 1; min-width: 280px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .pill { display: inline-flex; gap: 6px; align-items: center; padding: 2px 4px 2px 10px; border-radius: 14px; background: #1f6feb33; border: 1px solid var(--accent); font-size: 12px; }
  .pill button { border: 0; background: transparent; padding: 0 6px; color: var(--muted); }
  .layout { display: flex; max-width: 1400px; margin: 0 auto; }
  aside { width: 250px; flex: none; padding: 16px 12px 40px 20px; position: sticky; top: 112px; align-self: flex-start; max-height: calc(100vh - 112px); overflow-y: auto; }
  aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 4px; display: flex; }
  aside h3:first-child { margin-top: 0; }
  aside h3 a { margin-left: auto; color: var(--accent); cursor: pointer; text-transform: none; letter-spacing: 0; display: none; }
  aside h3.active a { display: inline; }
  .opt { display: flex; gap: 8px; align-items: center; padding: 3px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; user-select: none; }
  .opt:hover { background: var(--line); }
  .opt.on { background: #1f6feb26; }
  .opt .n { margin-left: auto; color: var(--muted); font-size: 11px; }
  .opt.zero { opacity: .4; }
  .opt .icon { width: 14px; height: 14px; }
  .opt .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #repoSearch { width: 100%; margin-bottom: 4px; padding: 3px 8px; font-size: 12px; }
  #repoOpts { max-height: 240px; overflow-y: auto; }
  main { flex: 1; min-width: 0; padding: 16px 20px 40px 8px; }
  .group { margin-bottom: 18px; }
  .group h2 { font-size: 13px; margin: 0 0 6px; padding: 0 4px; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .group h2 .count { background: var(--border); color: var(--text); border-radius: 10px; padding: 0 7px; font-size: 11px; }
  .chip { padding: 2px 10px; border-radius: 14px; border: 1px solid var(--border); background: transparent; font-size: 12px; color: var(--muted); }
  .card { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .row { display: flex; gap: 12px; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--line); position: relative; }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: #1c2230; }
  .row.unread::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
  .row.read .title { color: var(--muted); }
  .icon { flex: none; width: 18px; height: 18px; }
  .body { flex: 1; min-width: 0; }
  .title { color: var(--text); text-decoration: none; font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title:hover { color: var(--accent); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 1px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 0 7px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); }
  .tag.bot { color: var(--accent); border-color: #1f6feb88; }
  .tag.state-open { color: var(--open); border-color: #3fb95066; }
  .tag.state-merged { color: var(--merged); border-color: #a371f766; }
  .tag.state-closed, .tag.state-not_planned { color: var(--closed); border-color: #f8514966; }
  .tag.state-draft { color: var(--draft); }
  .row .actions { display: flex; gap: 6px; opacity: 0; transition: opacity .1s; }
  .row:hover .actions { opacity: 1; }
  .row input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; flex: none; }
  .time { color: var(--muted); font-size: 12px; width: 70px; text-align: right; flex: none; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  .help { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.6; }
  .help code { background: var(--line); padding: 0 4px; border-radius: 4px; }
  .s-open { color: var(--open); } .s-merged { color: var(--merged); } .s-closed, .s-not_planned { color: var(--closed); }
  .s-draft, .s-none { color: var(--draft); }
  .hidden { display: none !important; }
</style>
<header>
  <div class="top">
    <h1>GitHub Notifications</h1>
    <div class="seg" id="tabs"><button data-v="inbox" class="on">Inbox</button><button data-v="history">Done history <span id="histCount"></span></button><button data-v="jobs">Queued jobs <span id="jobsCount"></span></button></div>
    <span id="status"></span>
  </div>
  <div class="bar">
    <input id="q" type="text" placeholder='Search: words, is:pr state:merged repo:my-repo author:me reason:mention age:<2d -dependabot  (press / to focus)'>
    <select id="sort">
      <option value="new">Sort: newest</option><option value="old">Sort: oldest</option>
      <option value="repo">Sort: repo</option><option value="title">Sort: title</option>
    </select>
    <select id="group">
      <option value="repo">Group: repo</option><option value="none">Group: none</option>
      <option value="reason">Group: reason</option><option value="state">Group: state</option><option value="type">Group: type</option>
    </select>
    <button id="clearAll">Clear filters</button>
  </div>
  <div class="pills" id="pills"></div>
  <div class="bar inboxOnly">
    <button id="selAll">Select visible</button>
    <button id="doneSel" class="primary" disabled>Done</button>
    <button id="doneMatch" class="danger">Done all matching</button>
    <button id="doneClosed" class="danger" title="Mark every closed or merged PR as done">Done: closed/merged PRs</button>
    <label style="color:var(--muted)"><input id="all" type="checkbox"> include read</label>
    <button id="refresh">Refresh</button>
  </div>
  <div class="bar historyOnly hidden">
    <button id="clearHist" class="danger">Clear history</button>
  </div>
</header>
<div id="jobsView" class="hidden" style="max-width:1400px;margin:0 auto;padding:12px 16px">
  <div class="bar"><button id="jobsRefresh">Refresh</button><span id="jobsStatus" style="color:var(--muted)"></span></div>
  <div id="jobsList"></div>
</div>
<div class="layout" id="mainLayout">
  <aside id="facets"></aside>
  <main id="list"></main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const P = (d) => `<path d="${d}"/>`;
const svg = (cls, inner) => `<svg class="icon ${cls}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const circ = (x, y) => `<circle cx="${x}" cy="${y}" r="1.8"/>`;

function icon(n) {
  const s = n.state || "none";
  const c = "s-" + s;
  switch (n.type) {
    case "PullRequest":
      if (s === "merged") return svg(c, circ(4, 3.5) + circ(4, 12.5) + circ(12, 11) + P("M4 5.3v5.4M5.8 3.5h2.2a2 2 0 0 1 2 2v3.8"));
      if (s === "closed") return svg(c, circ(4, 3.5) + circ(4, 12.5) + circ(12, 12.5) + P("M4 5.3v5.4M12 10.7V6M10.2 2.5l3.6 3.6M13.8 2.5l-3.6 3.6"));
      if (s === "draft") return svg(c, circ(4, 3.5) + circ(4, 12.5) + circ(12, 12.5) + P("M4 5.3v5.4M12 10.7V9.5M12 7V5.5"));
      return svg(c, circ(4, 3.5) + circ(4, 12.5) + circ(12, 12.5) + P("M4 5.3v5.4M12 10.7V6a2 2 0 0 0-2-2H8.5M10 2.2L8.3 4 10 5.8"));
    case "Issue":
      if (s === "closed") return svg(c, `<circle cx="8" cy="8" r="6.2"/>` + P("M5.5 8.2l1.8 1.8 3.4-3.6"));
      if (s === "not_planned") return svg(c, `<circle cx="8" cy="8" r="6.2"/>` + P("M5.5 10.5l5-5"));
      return svg(c, `<circle cx="8" cy="8" r="6.2"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/>`);
    case "Commit": return svg("s-none", `<circle cx="8" cy="8" r="2.6"/>` + P("M1.5 8h3.9M10.6 8h3.9"));
    case "Release": return svg("s-open", P("M2 8.5V3a1 1 0 0 1 1-1h5.5l5.5 5.5-6 6z") + circ(5, 5));
    case "Discussion": return svg("s-none", P("M2.5 3h11a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H8l-3 2.5V11H2.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"));
    case "CheckSuite": return svg("s-closed", `<circle cx="8" cy="8" r="6.2"/>` + P("M5.5 5.5l5 5M10.5 5.5l-5 5"));
    default: return svg("s-none", P("M3 2.5h8a2 2 0 0 1 2 2v9H5a2 2 0 0 1-2-2z") + P("M3 11.5a2 2 0 0 1 2-2h8"));
  }
}
const typeLabel = { PullRequest: "Pull requests", Issue: "Issues", Commit: "Commits", Release: "Releases", Discussion: "Discussions", CheckSuite: "CI runs" };
const stateLabel = { open: "Open", merged: "Merged", closed: "Closed", draft: "Draft", not_planned: "Not planned", none: "No state" };
const typeAlias = { pr: "PullRequest", issue: "Issue", commit: "Commit", release: "Release", discussion: "Discussion", ci: "CheckSuite" };
const botRe = /^(chore|build|fix)\(deps(-dev)?\)|^bump /i;
const isBot = (n) => n.author ? /\[bot\]$/.test(n.author) : botRe.test(n.title);
const isClosedPR = (n) => n.type === "PullRequest" && (n.state === "closed" || n.state === "merged");
const stateOf = (n) => n.state || "none";
const kindOf = (n) => (isBot(n) ? "bot" : "human");
const reasonOf = (n) => n.reason.replace(/_/g, " ");
const ageMs = (n) => Date.now() - new Date(n.updated || n.doneAt);

// facet definitions: key -> value extractor, labels, order
const FACETS = [
  { key: "type", title: "Type", get: (n) => n.type, label: (v) => typeLabel[v] || v, icon: (v) => icon({ type: v, state: "none" }) },
  { key: "state", title: "State", get: stateOf, label: (v) => stateLabel[v] || v },
  { key: "reason", title: "Reason", get: reasonOf, label: (v) => v },
  { key: "kind", title: "Author type", get: kindOf, label: (v) => (v === "bot" ? "Bots (dependabot...)" : "People") },
  { key: "read", title: "Read status", get: (n) => (n.unread ? "unread" : "read"), label: (v) => v },
  { key: "age", title: "Age", get: (n) => { const d = ageMs(n) / 864e5; return d < 1 ? "<1d" : d < 7 ? "1-7d" : d < 30 ? "7-30d" : ">30d"; }, label: (v) => v, order: ["<1d", "1-7d", "7-30d", ">30d"] },
  { key: "repo", title: "Repository", get: (n) => n.repo, label: (v) => v.split("/")[1] || v, search: true },
];
const DEFAULT_FILTERS = () => ({ type: [], state: [], reason: [], kind: ["human"], read: [], age: [], repo: [] });

let tab = "inbox", items = [], history = [], selected = new Set();
let filters = Object.assign(DEFAULT_FILTERS(), JSON.parse(localStorage.getItem("ghn.filters") || "{}"));
let repoQuery = "";
$("q").value = localStorage.getItem("ghn.q") || "";
$("sort").value = localStorage.getItem("ghn.sort") || "new";
$("group").value = localStorage.getItem("ghn.group") || "repo";

function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}
const source = () => (tab === "inbox" ? items : history);

// ---- search query parsing ----
function parseDuration(s) {
  const m = s.match(/^([<>]?)(\d+)([hdw])$/);
  if (!m) return null;
  const ms = +m[2] * { h: 36e5, d: 864e5, w: 6048e5 }[m[3]];
  return { op: m[1] || "<", ms };
}
function parseQuery(q) {
  const terms = [];
  for (const raw of q.match(/-?(?:\w+:)?(?:"[^"]*"|\S+)/g) || []) {
    let neg = raw.startsWith("-"), t = neg ? raw.slice(1) : raw;
    const m = t.match(/^(\w+):(.*)$/);
    if (m && ["is", "state", "repo", "author", "reason", "type", "age", "title"].includes(m[1])) {
      terms.push({ neg, key: m[1], val: m[2].replace(/^"|"$/g, "").toLowerCase() });
    } else terms.push({ neg, key: "text", val: t.replace(/^"|"$/g, "").toLowerCase() });
  }
  return terms;
}
function termMatch(n, t) {
  const v = t.val;
  switch (t.key) {
    case "text": return (n.title + " " + n.repo + " " + (n.author || "")).toLowerCase().includes(v);
    case "title": return n.title.toLowerCase().includes(v);
    case "repo": return n.repo.toLowerCase().includes(v);
    case "author": return v === "me" ? n.reason === "author" : (n.author || "").toLowerCase().includes(v);
    case "reason": return reasonOf(n).includes(v.replace(/_/g, " "));
    case "state": return stateOf(n) === v.replace("-", "_") || (v === "closed" && stateOf(n) === "merged" && false);
    case "type": return n.type.toLowerCase() === (typeAlias[v] || v).toLowerCase();
    case "age": { const d = parseDuration(v); if (!d) return true; return d.op === "<" ? ageMs(n) < d.ms : ageMs(n) > d.ms; }
    case "is":
      if (typeAlias[v]) return n.type === typeAlias[v];
      if (v === "unread") return !!n.unread;
      if (v === "read") return !n.unread;
      if (v === "bot") return isBot(n);
      if (v === "human") return !isBot(n);
      if (v === "draft" || v === "open" || v === "merged") return stateOf(n) === v;
      if (v === "closed") return stateOf(n) === "closed" || stateOf(n) === "merged" || stateOf(n) === "not_planned";
      return true;
  }
  return true;
}

// ---- filtering ----
function matches(n, skipKey, terms) {
  for (const t of terms) if (termMatch(n, t) === t.neg) return false;
  for (const f of FACETS) {
    if (f.key === skipKey) continue;
    const sel = filters[f.key];
    if (sel.length && !sel.includes(f.get(n))) return false;
  }
  return true;
}
function visible() {
  const terms = parseQuery($("q").value);
  const arr = source().filter((n) => matches(n, null, terms));
  const sort = $("sort").value;
  const when = (n) => new Date(n.updated || n.doneAt);
  const cmp = { new: (a, b) => (tab === "history" ? new Date(b.doneAt) - new Date(a.doneAt) : when(b) - when(a)),
    old: (a, b) => when(a) - when(b), repo: (a, b) => a.repo.localeCompare(b.repo) || when(b) - when(a), title: (a, b) => a.title.localeCompare(b.title) }[sort];
  return arr.sort(cmp);
}

// ---- rendering ----
function renderFacets() {
  const terms = parseQuery($("q").value), src = source(), el = $("facets");
  el.innerHTML = "";
  for (const f of FACETS) {
    const base = src.filter((n) => matches(n, f.key, terms));
    const counts = new Map();
    base.forEach((n) => counts.set(f.get(n), (counts.get(f.get(n)) || 0) + 1));
    filters[f.key].forEach((v) => counts.has(v) || counts.set(v, 0));
    let vals = [...counts.keys()];
    vals.sort(f.order ? (a, b) => f.order.indexOf(a) - f.order.indexOf(b) : (a, b) => counts.get(b) - counts.get(a) || a.localeCompare(b));
    if (f.key === "kind") vals = ["human", "bot"].filter((v) => counts.has(v) || true);
    const h = document.createElement("h3");
    h.className = filters[f.key].length ? "active" : "";
    h.innerHTML = `<span>${f.title}</span><a>clear</a>`;
    h.querySelector("a").onclick = () => { filters[f.key] = []; update(); };
    el.appendChild(h);
    if (f.search) {
      const s = document.createElement("input");
      s.type = "text"; s.id = "repoSearch"; s.placeholder = "Find repo..."; s.value = repoQuery;
      s.oninput = () => { repoQuery = s.value; renderRepoOpts(f, vals, counts, box); };
      el.appendChild(s);
    }
    const box = document.createElement("div");
    if (f.search) box.id = "repoOpts";
    renderRepoOpts(f, vals, counts, box);
    el.appendChild(box);
  }
}
function renderRepoOpts(f, vals, counts, box) {
  box.innerHTML = "";
  for (const v of vals) {
    if (f.search && repoQuery && !v.toLowerCase().includes(repoQuery.toLowerCase())) continue;
    const c = counts.get(v) || 0, on = filters[f.key].includes(v);
    const o = document.createElement("div");
    o.className = "opt" + (on ? " on" : "") + (c === 0 && !on ? " zero" : "");
    o.innerHTML = `<input type="checkbox" ${on ? "checked" : ""} style="pointer-events:none;accent-color:var(--accent)">${f.icon ? f.icon(v) : ""}<span class="lbl"></span><span class="n">${c}</span>`;
    o.querySelector(".lbl").textContent = f.label(v);
    o.title = v;
    o.onclick = () => {
      const a = filters[f.key], i = a.indexOf(v);
      i < 0 ? a.push(v) : a.splice(i, 1);
      update();
    };
    box.appendChild(o);
  }
}
function renderPills() {
  const el = $("pills");
  el.innerHTML = "";
  for (const f of FACETS) for (const v of filters[f.key]) {
    const p = document.createElement("span");
    p.className = "pill";
    p.innerHTML = `<span></span><button title="Remove">x</button>`;
    p.querySelector("span").textContent = `${f.title}: ${f.label(v)}`;
    p.querySelector("button").onclick = () => { filters[f.key] = filters[f.key].filter((x) => x !== v); update(); };
    el.appendChild(p);
  }
  if (!$("q").value && !el.children.length) el.innerHTML = `<span class="help">Qualifiers: <code>is:pr</code> <code>is:issue</code> <code>is:unread</code> <code>is:bot</code> <code>state:merged</code> <code>repo:name</code> <code>author:name</code> <code>reason:mention</code> <code>age:&lt;2d</code> <code>age:&gt;1w</code> <code>-word</code> to exclude</span>`;
}
function row(n) {
  const d = document.createElement("div");
  const hist = tab === "history";
  d.className = "row " + (hist || !n.unread ? "read" : "unread");
  d.innerHTML = `${hist ? "" : `<input type="checkbox" ${selected.has(n.id) ? "checked" : ""}>`}${icon(n)}
    <div class="body"><a class="title" target="_blank" rel="noopener"></a>
    <div class="meta"><span class="repo"></span>${n.state ? `<span class="tag state-${n.state}">${stateLabel[n.state]}</span>` : ""}
    <span class="tag reason"></span>${isBot(n) ? '<span class="tag bot">bot</span>' : ""}<span class="author"></span></div></div>
    ${hist ? "" : '<div class="actions"><button class="done">Done</button></div>'}<span class="time">${hist ? ago(n.doneAt) : ago(n.updated)}</span>`;
  d.querySelector(".repo").textContent = n.repo;
  d.querySelector(".reason").textContent = reasonOf(n);
  d.querySelector(".author").textContent = n.author ? "by " + n.author : "";
  const a = d.querySelector(".title");
  a.textContent = n.title; a.href = n.url;
  if (!hist) {
    a.onclick = () => {
      if (n.unread) fetch("/api/read/" + n.id, { method: "POST" });
      n.unread = false; d.className = "row read";
    };
    d.querySelector("input").onchange = (e) => { e.target.checked ? selected.add(n.id) : selected.delete(n.id); updateBtns(); };
    d.querySelector(".done").onclick = () => done([n.id]);
  }
  return d;
}
function groupKey(n, mode) {
  return { repo: n.repo, reason: reasonOf(n), state: stateLabel[stateOf(n)], type: typeLabel[n.type] || n.type, none: "" }[mode];
}
function dayKey(iso) {
  const d = new Date(iso), t = new Date();
  const diff = Math.round((new Date(t.toDateString()) - new Date(d.toDateString())) / 864e5);
  return diff === 0 ? "Today" : diff === 1 ? "Yesterday" : d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function updateBtns() {
  $("doneSel").disabled = !selected.size;
  $("doneSel").textContent = selected.size ? `Done (${selected.size})` : "Done";
  const c = items.filter(isClosedPR).length;
  $("doneClosed").textContent = `Done: closed/merged PRs (${c})`;
  $("doneClosed").disabled = !c;
  const m = visible().length;
  $("doneMatch").textContent = `Done all matching (${m})`;
  $("doneMatch").disabled = !m;
  $("histCount").textContent = history.length ? `(${history.length})` : "";
}
function render() {
  const v = visible(), list = $("list");
  list.innerHTML = "";
  if (!v.length) list.innerHTML = `<div class="empty">${tab === "inbox" ? "Nothing matches. Adjust filters or enjoy inbox zero." : "No done items match."}</div>`;
  const mode = tab === "history" ? "day" : $("group").value;
  const groups = new Map();
  v.forEach((n) => {
    const k = mode === "day" ? dayKey(n.doneAt) : groupKey(n, mode);
    (groups.get(k) || groups.set(k, []).get(k)).push(n);
  });
  for (const [k, arr] of groups) {
    const g = document.createElement("div");
    g.className = "group";
    if (k) {
      g.innerHTML = `<h2><span></span><span class="count">${arr.length}</span>${tab === "inbox" ? '<button class="chip grp">Done all</button>' : ""}</h2>`;
      g.querySelector("h2 span").textContent = k;
      if (tab === "inbox") g.querySelector(".grp").onclick = () => done(arr.map((n) => n.id));
    }
    const card = document.createElement("div");
    card.className = "card";
    arr.forEach((n) => card.appendChild(row(n)));
    g.appendChild(card);
    list.appendChild(g);
  }
  $("status").textContent = `${v.length} shown / ${source().length} ${tab === "inbox" ? "total" : "done"}`;
}
function update() {
  localStorage.setItem("ghn.filters", JSON.stringify(filters));
  localStorage.setItem("ghn.q", $("q").value);
  localStorage.setItem("ghn.sort", $("sort").value);
  localStorage.setItem("ghn.group", $("group").value);
  renderFacets(); renderPills(); render(); updateBtns();
}

// ---- data ----
// fetch() throws a TypeError when the server is unreachable (stopped or restarted)
const errMsg = (e) => "Error: " + (e instanceof TypeError ? "cannot reach the server. Is it running? (npm start)" : e.message);
async function load() {
  $("status").textContent = "Loading...";
  try {
    const r = await fetch("/api/notifications?all=" + $("all").checked);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    items = data;
  } catch (e) { $("status").textContent = errMsg(e); return; }
  selected = new Set([...selected].filter((id) => items.some((n) => n.id === id)));
  update();
}
async function loadHistory() {
  history = await (await fetch("/api/history")).json();
  update();
}
let jobsLoaded = false;
async function loadJobs() {
  $("jobsStatus").textContent = "Loading...";
  try {
    const r = await fetch("/api/queued-jobs");
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    jobsLoaded = true;
    $("jobsCount").textContent = data.length ? `(${data.length})` : "";
    $("jobsStatus").textContent = data.length ? `${data.length} queued job(s)` : "No queued jobs";
    const list = $("jobsList");
    list.innerHTML = "";
    data.forEach((j) => {
      const row = document.createElement("div");
      row.className = "row";
      const a = document.createElement("a");
      a.href = j.url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = `${j.repo}: ${j.workflow} / ${j.name}`;
      const t = document.createElement("span");
      t.className = "time";
      t.textContent = "queued " + ago(j.createdAt);
      row.append(a, t);
      list.append(row);
    });
  } catch (e) { $("jobsStatus").textContent = errMsg(e); }
}
$("jobsRefresh").onclick = loadJobs;
async function done(ids) {
  const byId = new Map(items.map((n) => [n.id, n]));
  await Promise.all(ids.map((id) => {
    const n = byId.get(id) || {};
    const meta = { type: n.type, state: n.state, title: n.title, repo: n.repo, url: n.url, author: n.author, reason: n.reason, updated: n.updated };
    return fetch("/api/done/" + id, { method: "POST", body: JSON.stringify(meta) });
  }));
  items = items.filter((n) => !ids.includes(n.id));
  ids.forEach((id) => selected.delete(id));
  await loadHistory();
}
function confirmDone(ids, what) {
  if (ids.length && confirm(`Mark ${ids.length} ${what} as done?`)) done(ids);
}

// ---- wiring ----
document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => {
  tab = b.dataset.v;
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
  document.querySelectorAll(".inboxOnly").forEach((e) => e.classList.toggle("hidden", tab !== "inbox"));
  document.querySelectorAll(".historyOnly").forEach((e) => e.classList.toggle("hidden", tab !== "history"));
  $("group").classList.toggle("hidden", tab !== "inbox");
  const jobs = tab === "jobs";
  $("jobsView").classList.toggle("hidden", !jobs);
  $("mainLayout").classList.toggle("hidden", jobs);
  $("pills").classList.toggle("hidden", jobs);
  document.querySelectorAll("header .bar:not(.inboxOnly):not(.historyOnly)").forEach((e) => e.classList.toggle("hidden", jobs));
  if (jobs) { if (!jobsLoaded) loadJobs(); return; }
  update();
}));
["sort", "group"].forEach((id) => ($(id).onchange = update));
$("q").oninput = update;
$("all").onchange = load;
$("refresh").onclick = load;
$("clearAll").onclick = () => { filters = Object.assign(DEFAULT_FILTERS(), { kind: [] }); $("q").value = ""; update(); };
$("selAll").onclick = () => { visible().forEach((n) => selected.add(n.id)); update(); };
$("doneSel").onclick = () => selected.size && done([...selected]);
$("doneMatch").onclick = () => confirmDone(visible().map((n) => n.id), "matching notifications");
$("doneClosed").onclick = () => confirmDone(items.filter(isClosedPR).map((n) => n.id), "closed/merged PR notifications");
$("clearHist").onclick = async () => { if (confirm("Clear the done history log?")) { await fetch("/api/history", { method: "DELETE" }); loadHistory(); } };
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape") document.activeElement.blur();
});
loadHistory();
load();
setInterval(load, 120000);
</script>
