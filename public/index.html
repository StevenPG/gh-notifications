<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Notifications</title>
<link rel="stylesheet" href="/css/styles.css">
<header>
  <div class="top">
    <h1>GitHub Notifications</h1>
    <div class="seg" id="tabs"><button data-v="inbox" class="on">Inbox</button><button data-v="history">Done history <span id="histCount"></span></button></div>
    <span id="status"></span>
  </div>
  <div class="bar">
    <input id="q" type="text" placeholder='Search: words, is:pr state:merged repo:my-repo author:me reason:mention age:<2d -dependabot  (press / to focus)'>
    <select id="sort">
      <option value="new">Sort: newest</option><option value="old">Sort: oldest</option>
      <option value="repo">Sort: repo</option><option value="title">Sort: title</option>
    </select>
    <select id="group">
      <option value="repo">Group: repo</option><option value="none">Group: none</option>
      <option value="reason">Group: reason</option><option value="state">Group: state</option><option value="type">Group: type</option>
    </select>
    <button id="clearAll">Clear filters</button>
  </div>
  <div class="pills" id="pills"></div>
  <div class="bar inboxOnly">
    <button id="selAll">Select visible</button>
    <button id="doneSel" class="primary" disabled>Done</button>
    <button id="doneMatch" class="danger">Done all matching</button>
    <button id="doneClosed" class="danger" title="Mark every closed or merged PR as done">Done: closed/merged PRs</button>
    <label><input id="all" type="checkbox"> include read</label>
    <button id="refresh">Refresh</button>
  </div>
  <div class="bar historyOnly hidden">
    <button id="clearHist" class="danger">Clear history</button>
  </div>
</header>
<div class="layout">
  <aside id="facets"></aside>
  <main id="list"></main>
</div>
<script type="module" src="/js/main.js"></script>
